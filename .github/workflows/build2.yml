
name: Callee of plr Ubuntu jobs
run-name: Callee of plr Ubuntu jobs - ${{ github.event.head_commit.message }}

on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        required: false
        default: false

  workflow_call:
    inputs:
      debug_enabled:
        type: boolean
        required: false
        default: false
#     PG:
#       required: true
#       default: '18'
#       type: string
#     R:
#       required: true
#       default: 'repo'
#       type: string
#     os:
#       required: true
#       default: 'ubuntu-latest'
#       type: string
      ragged_schedule:
        type: string
        required: true

jobs:

  ubuntu_job_runner:
    name: callee Ubuntu - PG ${{ matrix.pg }} R ${{ matrix.R }} os ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Unexpected value 'false'
    continue-on-error: ${{ matrix.GithubActionsIgnoreFail == 'true' && true || false }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.ragged_schedule) }}

    steps:

    - name: Git Checkout this Repository Code
      uses: actions/checkout@v6
      
    - name: Get Linux Host Information
      run: |
        bash ./get_linux_host_info.sh

    - name: Guarantee PostgreSQL is Not Installed
      run: |
        bash ./guarantee_postgres_is_not_installed.sh

    - name: Refresh APT
      run: |
        set -x -v -e
        sudo apt-get update -qq

