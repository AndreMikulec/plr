#           # than what is available at EnterpriseDB 17.10-2 (June 12 2026)
#           #
#           # pgWINversion: 17.11-1
#           MSYS2testonpgWIN: true
#
#
#         # R latest and PostgreSQL 4th latest (buildpgFromSRCmethod meson)
#         - matid: '10'
#           os: windows-2025-vs2026
#           GithubActionsIgnoreFail: false
#           compilerEnv: UCRT64
#           shellEnv: msys2 {0}
#           compilerExe: gcc
