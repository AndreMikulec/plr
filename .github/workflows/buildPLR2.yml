
name: Callee of Windows Builds PL/R
run-name: Callee of Windows Builds PL/R - ${{ github.event.head_commit.message }}

env:
  TZ: UTC

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        required: false
        default: false

  workflow_call:
    inputs:
      debug_enabled:
        type: boolean
        required: false
        default: false
      ragged_schedule:
        type: string
        required: true

jobs:
  
  build_test_install:
    name: matid ${{ matrix.matid }} R ${{ matrix.rversion }} PGsrc ${{ matrix.pgSRCversion }} PGbin ${{ matrix.pgWINversion }} ${{ matrix.compilerEnv }} ${{ matrix.Platform }}  ${{ matrix.os }} ${{ matrix.Configuration }} PGSRC ${{ matrix.buildpgFromSRC }} PGSRCMETH ${{ matrix.buildpgFromSRCmethod }} SRCCTB ${{ matrix.buildpgANDplrInSRCcontrib }}
    runs-on: ${{ matrix.os }}
    # With "continue-on-error" (and with "fail-fast") emulate Appveyor "allow_failures"
    # Prevents a workflow run from failing when a job fails. Set to true to allow a workflow run to pass when this job fails.
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idcontinue-on-error
    continue-on-error: ${{ matrix.GithubActionsIgnoreFail == 'true' && true || false }}
    strategy:
      # Disable fail-fast as we want results from all even if one fails.
      fail-fast: false
      matrix:

      # Repository/Virtual_Machine PostgreSQL binaries are not known automatically.
      # (See far below in the matrix.)
      #
      # In two matrix items, already-compiled repository found
      # PostreSQL already compiled binaries are used.
      #
      # The repository PostgreSQL version in HERE
      # is not [easily] detectable ahead of the build method.
      # Therefore, a HUMAN, must often check and set the build matrix versions
      # in the Github Actions build matrix, before the Github Action runs.
      # (I do not yet have an [easy automated] work around.)
      #
      # Already-compiled PostgreSQL binaries in repositories in these places HERE.
      #
      #    Type: Pull the binary from here.
      # 1. https://packages.msys2.org/package/mingw-w64-ucrt-x86_64-postgresql
      #
      #    Type: Build within this virtual machine with the installed binary here.
      # 2. https://github.com/actions/runner-images/blob/main/images/win/Windows2022-Readme.md
      #    Note, I can not uninstall PostgreSQL for Windows. I tried.

      # "next PostgreSQL" version is not known automatically.
      #
      # In the caseof "next PostgreSQL" (See far below in the matrix)
      # a HUMAN must manually see the VERSION.

      # AUG 30 2026 (does the fileid stay the same or change per ${PG}?)
      # Windows x86-64
      # 18.6   18.6-1  https://sbp.enterprisedb.com/getfile.jsp?fileid=1260436
      # 17.11  17.11-1 https://sbp.enterprisedb.com/getfile.jsp?fileid=1260428
      # 16.15  16.15-1 https://sbp.enterprisedb.com/getfile.jsp?fileid=1260421
      # 15.19  15.19-1 https://sbp.enterprisedb.com/getfile.jsp?fileid=1260414
      # 14.24  14.24-1 https://sbp.enterprisedb.com/getfile.jsp?fileid=1260407
      # https://www.enterprisedb.com/downloads/postgres-postgresql-downloads

        include: ${{ fromJSON(inputs.ragged_schedule) }}

#         # Note, the x86 Cygwin Server will "not start" on Github Actions.
#         # Therfore cygwin x86 is "not PostgreSQL regression testable."
#         #
#         # Repository R and Repository Postgresql
#         # Package: R
#         # https://www.cygwin.com/packages/summary/R.html
#         # Package: postgresql
#         # https://www.cygwin.com/packages/summary/postgresql.html
#         #
#         # current Cygwin repository
#         - matid: '01'
#           os: windows-2025-vs2026
#           GithubActionsIgnoreFail: false
#           compilerEnv: cygwin
#           Platform: x64
#           Configuration: Release
#
#
#         # devel-aarch64 rversion
#         # Win-installer-aarch64 on runner page
#         # R-devel-aarch64.exe gh downloaded
#         # 
#         # R on 64-bit ARM Windows - Tomas Kalibera - 2024/04/23
#         #   R-devel-aarch64 “sub-architectures” are not used
#         #   Hence, e.g. Rgui.exe is located directly in bin, while it is in bin/x64 on x86_64 (R-devel-x86_64)
#         #   R-devel-aarch64 LLVM is needed because GCC does not support Windows/aarch64
#         #   Also, R-devel-aarch64 CRAN packages are already tested with LLVM clang
#         # https://blog.r-project.org/2024/04/23/r-on-64-bit-arm-windows/
#         #
#         # R bleeding edge and PostgreSQL bleeding edge (buildpgFromSRCmethod meson)
#         - matid: '02'
#           os: windows-11-vs2026-arm
#           GithubActionsIgnoreFail: false
#           compilerEnv: CLANGARM64
#           shellEnv: msys2 {0}
#           compilerExe: clang
#           Platform: x64
#           Configuration: Debug
#           #
#           rversion: devel-aarch64
#           R_HOME: 'C:\RINSTALL'
#           # R_ARCH - not a multiarchitecture (like cygwin)
#           #
#           # pgSRCversion: master
#           # Install repository "postgres" (whatever version)
#           # buildpgFromSRC: true
#           # buildpgFromSRCmethod: meson
#           # PG_HOME: 'C:\PGINSTALL'
#           #
#           # 3rd allowable combination
#           buildpgFromSRC: false
#           PG_HOME: repo
#
#
#         # devel-x86_64 rversion
#         # Win-installer-x86_64 on runner page
#         # R-devel-x86_64.exe gh downloaded
#         # https://blog.r-project.org/2024/04/23/r-on-64-bit-arm-windows/
#         #
#         # R bleeding edge and PostgreSQL bleeding edge (buildpgFromSRCmethod meson)
#         - matid: '03'
#           os: windows-2025-vs2026
#           GithubActionsIgnoreFail: false
#           compilerEnv: UCRT64
#           shellEnv: msys2 {0}
#           compilerExe: gcc
#           Platform: x64
#           Configuration: Debug
#           #
#           rversion: devel-x86_64
#           R_HOME: 'C:\RINSTALL'
#           R_ARCH: /x64
#           #
#           pgSRCversion: master
#           buildpgFromSRC: true
#           buildpgFromSRCmethod: meson
#           PG_HOME: 'C:\PGINSTALL'
#
#
#         # plr for "R 4.3.0 (and later) for Windows" can not be compiled with Microsoft Visual Studio.
#         # Therefore, here, plr for "R 4.3.0 (and later) for Windows" is compiled with MSYS2(UCRT64/MINGW32).
#         # It is regression tested twice.
#         #
#         #   The first regression test is within PostgreSQL on MSYS2.
#         #
#         #   The second regression test is within PostgreSQL that had been compiled with Microsoft Visual Studio
#         #   from EnterpriseDB (if available: master _RC* and _BETA* versions are often not available).
#         #
#         # Here are the reasons why plr for "R 4.3.0 (and later) for Windows"
#         # can not be compiled with Microsoft Visual Studio.
#         #
#         # Bug 18544 - private_data_c Visual Studio 2022 R-4.3.0 Complex.h(81,21): syntax error: missing ';' before identifier 'private_data_c'
#         # Status: CLOSED WONTFIX
#         # https://bugs.r-project.org/show_bug.cgi?id=18544
#         #
#         # The new definition does not work with MSVC compilers because they don't support the C99 _Complex type
#         # https://learn.microsoft.com/en-us/cpp/c-runtime-library/complex-math-support?view=msvc-170
#         #
#         # C Complex Numbers in C++?
#         # https://stackoverflow.com/questions/10540228/c-complex-numbers-in-c
#         #
#
#         # windows-2025-vs2026 (uses PG 17)
#         # windows-2022 (uses PG 14)
#         # https://github.com/actions/runner-images
#
#         # R bleeding edge and PostgreSQL bleeding edge (buildpgFromSRCmethod meson)
#         - matid: '04'
#           os: windows-2025-vs2026
#           GithubActionsIgnoreFail: false
#           compilerEnv: UCRT64
#           shellEnv: msys2 {0}
#           compilerExe: gcc
#           Platform: x64
#           Configuration: Debug
#           #
#           rversion: devel
#           R_HOME: 'C:\RINSTALL'
#           R_ARCH: /x64
#           #
#           pgSRCversion: master
#           buildpgFromSRC: true
#           buildpgFromSRCmethod: meson
#           PG_HOME: 'C:\PGINSTALL'
#
#
#         # R latest and PostgreSQL bleeding edge (buildpgFromSRCmethod meson)
#         - matid: '05'
#           os: windows-2025-vs2026
#           GithubActionsIgnoreFail: false
#           compilerEnv: UCRT64
#           shellEnv: msys2 {0}
#           compilerExe: gcc
#           Platform: x64
#           Configuration: Debug
#           #
#           rversion: 4.6.1
#           R_HOME: 'C:\RINSTALL'
#           R_ARCH: /x64
#           #
#           pgSRCversion: master
#           buildpgFromSRC: true
#           buildpgFromSRCmethod: meson
#           PG_HOME: 'C:\PGINSTALL'
#
#
# #          # 'REL' is later than 'BETA'. Higher numbers are later than lower numbers.
# #        # FUTURE
# #        # R latest and PostgreSQL next (buildpgANDplrInSRCcontrib true)
# #        - matid: '04'
# #          os: windows-2025-vs2026
# #          GithubActionsIgnoreFail: false
# #          compilerEnv: UCRT64
# #          shellEnv: msys2 {0}
# #          compilerExe: gcc
# #          Platform: x64
# #          Configuration: Debug
# #          #
# #          rversion: 4.6.1
# #          R_HOME: 'C:\RINSTALL'
# #          R_ARCH: /x64
# #          #
# #          # A HUMAN must manually see the VERSION here. (seen Jul 13 2024 EST)
# #          # Because this is "next PostgreSQL",
# #          # if available are/is 'release candidate' REL_AA_RC#
# #          # and/or 'beta' REL_AA_BETA# version(s)
# #          # then choose that 'latest' version;
# #          # Otherwise, just choose the latest REL_XX_Y or better just REL_XX_STABLE
# #          # https://github.com/postgres/postgres/tags
# #          pgSRCversion: REL_20_BETA1
# #          #
# #          buildpgFromSRC: true
# #          buildpgFromSRCmethod: make/meson(PostgreSQL 16+)
# #          #   Add meson build system (Andres Freund, Nazir Bilal Yavuz, Peter Eisentraut)
# #          #   https://www.postgresql.org/docs/16/release-16.html
# #          # xor
# #        # # 2nd combination allowed
# #        # # DOES NOT WORK ANYMORE
# #        # buildpgANDplrInSRCcontrib: true
# #          #
# #          PG_HOME: 'C:\PGINSTALL'
#
#
#         # R bleeding and PostgreSQL latest (buildpgFromSRCmethod meson)
#         - matid: '06'
#           os: windows-2025-vs2026
#           GithubActionsIgnoreFail: false
#           compilerEnv: UCRT64
#           shellEnv: msys2 {0}
#           compilerExe: gcc
#           Platform: x64
#           Configuration: Debug
#           #
#           rversion: devel
#           R_HOME: 'C:\RINSTALL'
#           R_ARCH: /x64
#           #
#           pgSRCversion: REL_19_STABLE
#           buildpgFromSRC: true
#           buildpgFromSRCmethod: meson
#           PG_HOME: 'C:\PGINSTALL'
#           #
#           # pgWINversion: 19.1-1
#           # MSYS2testonpgWIN: true
#
#
#         # R latest and PostgreSQL latest (buildpgFromSRCmethod meson)
#         - matid: '07'
#           os: windows-2025-vs2026
#           GithubActionsIgnoreFail: false
#           compilerEnv: UCRT64
#           shellEnv: msys2 {0}
#           compilerExe: gcc
#           Platform: x64
#           Configuration: Release
#           #
#           rversion: 4.6.1
#           R_HOME: 'C:\RINSTALL'
#           R_ARCH: /x64
#           #
#           pgSRCversion: REL_19_STABLE
#           buildpgFromSRC: true
#           buildpgFromSRCmethod: meson
#           PG_HOME: 'C:\PGINSTALL'
#           #
#           # pgWINversion: REL_X_Y.future-future
#           #
#           # not "MSYS2testonpgWIN: true" - because no existing "PostgreSQL REL_X_Y for Windows" exists anywhere.
