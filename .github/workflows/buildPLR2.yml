#           PG_HOME: 'C:\PGINSTALL'
#           #
#           # EnterpriseDB PostgreSQL for Windows
#           # windows-2025-vs2026 and pgWINversion: 17.x-y
#           # 
#           # (if MANUAL would be: 17.10-2)
#           #
#           # A HUMAN must manually see the VERSION here. (seen Jun 12 2026 EST)
#           # Jun 2026 - Pre-installed Github Actions PostgreSQL for Windows version is x64-14
#           # ServiceName postgresql-x64-17
#           # Version 17.10
#           # REAFFIRMED JUN 12 2026
#           # https://github.com/actions/runner-images
#           #
