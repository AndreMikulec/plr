#           # This may not be available if pgSRCversion is 'RC' or 'BETA'.
#           # pgWINversion: x.y-z
#           # This may not be available if pgSRCversion is 'RC' or 'BETA'.
#           # MSYS2testonpgWIN: true
#           #
#           #   pgWINversion: 19.?-?
#           #   MSYS2testonpgWIN: false
#           # pgWINversion: 19.1-1
#           # MSYS2testonpgWIN: true
#
#
#         # R latest and PostgreSQL 2nd latest (buildpgFromSRCmethod meson)
#         - matid: '08'
#           os: windows-2025-vs2026
#           GithubActionsIgnoreFail: false
#           compilerEnv: UCRT64
#           shellEnv: msys2 {0}
#           compilerExe: gcc
#           Platform: x64
#           Configuration: Release
#           #
#           rversion: 4.6.1
#           R_HOME: 'C:\RINSTALL'
#           R_ARCH: /x64
