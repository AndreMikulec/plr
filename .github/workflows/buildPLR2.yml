#           buildpgFromSRC: true
#           buildpgFromSRCmethod: meson
#           PG_HOME: 'C:\PGINSTALL'
#           #
#           pgWINversion: 18.6-1
#           MSYS2testonpgWIN: true
#
#
#         # R latest and PostgreSQL 3rd latest (buildpgFromSRCmethod meson)
#         - matid: '09'
#           os: windows-2025-vs2026
#           GithubActionsIgnoreFail: false
#           compilerEnv: UCRT64
#           shellEnv: msys2 {0}
#           compilerExe: gcc
#           Platform: x64
