
name: Callee of Windows Builds PL/R
run-name: Callee of Windows Builds PL/R - ${{ github.event.head_commit.message }}

env:
  TZ: UTC

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        required: false
        default: false

  workflow_call:
    inputs:
      debug_enabled:
        type: boolean
        required: false
        default: false
      ragged_schedule:
        type: string
        required: true

jobs:
  
  build:
    name: matid
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.GithubActionsIgnoreFail == 'true' && true || false }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.ragged_schedule) }}

    steps:

      - name: Echo
        run: |
          echo "Nothing"
