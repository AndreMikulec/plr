
name: Ubuntu Builds PLR jobs
run-name: Ubuntu Builds PLR jobs - ${{ github.event.head_commit.message }}

env:
  TZ: UTC

on:
  push:
  pull_request:
  workflow_dispatch:
      debug_enabled:
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '30 1 * * *'

jobs:

  ubuntu_scheduled_daily_job_caller:
    name: Ubuntu daily builds
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '30 1 * * *' }}
    uses: ./.github/workflows/build2.yml
    with:
      ragged_schedule: >
        [
          { "PG": "master",  "R": "repo", "os": "ubuntu-24.04",      "GithubActionsIgnoreFail": "false" },
          { "PG": "REL_19_", "R": "repo", "os": "ubuntu-24.04",      "GithubActionsIgnoreFail": "false" }
        ]

  ubuntu_fullbuildable_job_caller:
    name: Ubuntu all builds
    if: ${{ github.event_name != 'schedule' }}
    uses: ./.github/workflows/build2.yml
    with:
      ragged_schedule: >
        [
          { "PG": "11",      "R": "repo", "os": "ubuntu-24.04",      "GithubActionsIgnoreFail": "false" }
        ]
#         { "PG": "master",  "R": "repo", "os": "ubuntu-24.04",      "GithubActionsIgnoreFail": "false" },
#         { "PG": "18",      "R": "repo", "os": "ubuntu-24.04",      "GithubActionsIgnoreFail": "false" },
#         { "PG": "18",      "R": "repo", "os": "ubuntu-24.04-arm",  "GithubActionsIgnoreFail": "false" },
#         { "PG": "REL_19_", "R": "repo", "os": "ubuntu-24.04",      "GithubActionsIgnoreFail": "false" },
#         { "PG": "17",      "R": "repo", "os": "ubuntu-24.04",      "GithubActionsIgnoreFail": "false" },
#         { "PG": "16",      "R": "repo", "os": "ubuntu-24.04",      "GithubActionsIgnoreFail": "false" },
#         { "PG": "15",      "R": "repo", "os": "ubuntu-24.04",      "GithubActionsIgnoreFail": "false" },
#         { "PG": "14",      "R": "repo", "os": "ubuntu-24.04",      "GithubActionsIgnoreFail": "false" },
#         { "PG": "13",      "R": "repo", "os": "ubuntu-24.04",      "GithubActionsIgnoreFail": "false" },
