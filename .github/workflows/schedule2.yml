#             R: 'next'
#             os: ubuntu-24.04
#           - PG: REL_19_
#             R: 'next'
#             os: ubuntu-24.04
#           - PG: 20
#             R: 'next'
#             os: ubuntu-24.04
#           - PG: 19
#             R: 'devel'
#             os: ubuntu-24.04
#           - PG: 18
#             R: 'repo'
#             os: ubuntu-24.04-arm

    uses: ./.github/workflows/build2.yml
    with:
#     target: ${{ matrix.target }}
      ragged_schedule: >
        [
          { "PG": "master",  "R": "repo", "os": "ubuntu-24.04",      "GithubActionsIgnoreFail": "false" }
        ]

