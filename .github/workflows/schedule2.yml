
name: Ubuntu Builds PLR jobs
run-name: Ubuntu Builds PLR jobs - ${{ github.event.head_commit.message }}

env:
  TZ: UTC

on:
  push:
  pull_request:
  workflow_dispatch:
      debug_enabled:
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '30 1 * * *'

# SEEN AUG 2026
# ubuntu-latest or ubuntu-24.04
# ubuntu-24.04-arm
# https://github.com/actions/runner-images

jobs:

  ubuntu_scheduled_daily_job_caller:
    name: Ubuntu daily builds
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '30 1 * * *' }}
#   runs-on: ${{ matrix.os }}
#   strategy:
#     fail-fast: false
#     matrix:
#       target:
#         include:
#           - PG: master
#             R: 'next'
#             os: ubuntu-24.04
#           - PG: REL_19_
#             R: 'next'
#             os: ubuntu-24.04

    uses: ./.github/workflows/build2.yml
    with:
#     target: ${{ matrix.target }}
      ragged_schedule: >
        [
          { "PG": "master",  "R": "repo", "os": "ubuntu-24.04",      "GithubActionsIgnoreFail": "false" },
          { "PG": "REL_19_", "R": "repo", "os": "ubuntu-24.04",      "GithubActionsIgnoreFail": "false" }
        ]

  ubuntu_fullbuildable_job_caller:
    name: Ubuntu all builds
    if: ${{ github.event_name != 'schedule' }}
