
name: Caller of plr jobs
run-name: Caller of plr jobs - ${{ github.event.head_commit.message }}

on: 
  push:
  pull_request: 
  workflow_dispatch:
      debug_enabled:
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '30 1 * * *'

# SEEN AUG 2026
# ubuntu-latest or ubuntu-24.04 
# ubuntu-24.04-arm
# https://github.com/actions/runner-images

jobs:

  ubuntu_scheduled_daily_job_caller:
    name: call Ubuntu daily
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '30 1 * * *' }}
#   runs-on: ${{ matrix.os }}
#   strategy:
#     fail-fast: false
#     matrix:
#       target:
#         include:
#           - PG: master
#             R: 'next'
#             os: ubuntu-latest
#           - PG: REL_19_
#             R: 'next'
#             os: ubuntu-latest

    uses: ./.github/workflows/build2.yml
    with:
#     target: ${{ matrix.target }}
      ragged_schedule: >
        [
          {"PG": "master", " R": "repo", "os": "ubuntu-latest", "GithubActionsIgnoreFail": "false"},
          {"PG": "REL_19_", "R": "repo", "os": "ubuntu-latest", "GithubActionsIgnoreFail": "false"}
        ]

  ubuntu_fullbuildable_job_caller:
    name: call Ubuntu build
    if: ${{ github.event_name != 'schedule' }}
#   runs-on: ${{ matrix.os }}
#   strategy:
#     fail-fast: false
#     matrix:
#       target:
#         PG: [20, 19, 18, 17, 16, 15, 14, 13, 12, 10]
#         R: 'repo'
#         os: ubuntu-latest
#         include:
#           - PG: master
#             R: 'next'
#             os: ubuntu-latest
#           - PG: REL_19_
#             R: 'next'
#             os: ubuntu-latest
#           - PG: 20
#             R: 'next'
#             os: ubuntu-latest
#           - PG: 19
#             R: 'devel'
#             os: ubuntu-latest
#           - PG: 18
#             R: 'repo'
#             os: ubuntu-24.04-arm

    uses: ./.github/workflows/build2.yml
    with:
#     target: ${{ matrix.target }}
      ragged_schedule: >
        [
          {"PG": "18",      "R": "repo", "os": "ubuntu-latest", "GithubActionsIgnoreFail": "false"},
          {"PG": "REL_19_", "R": "repo", "os": "ubuntu-latest", "GithubActionsIgnoreFail": "false"}
        ]

