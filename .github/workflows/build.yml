name: plr CI 
run-name: plr CI - ${{ github.event.head_commit.message }}

on: 
   push:
   pull_request: 
   workflow_dispatch:

jobs:

  job_master:
    name: PG master ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - name: Echo site details
        run: echo building - master
 
      - name: Checkout code
        uses: actions/checkout@v6
 
      - name: checkout postgres
        run: |
          sudo apt-get update -qq
          sudo apt-key adv --keyserver keyserver.ubuntu.com --recv-keys E298A3A825C0D65DFD57CBB651716619E084DAB9
          sudo add-apt-repository "deb https://cloud.r-project.org/bin/linux/ubuntu $(lsb_release -cs)-cran40/"
          sudo apt-get install -qq r-base-dev acl bison flex libssl-dev
          sudo R --version
          sudo /etc/init.d/postgresql stop
          sudo apt-get remove --purge postgresql\*
          sudo rm -rf /etc/postgresql /var/lib/postgresql
          git clone https://github.com/postgres/postgres.git
          pushd postgres
          git checkout master
          ./configure
          make -j4
          sudo make install
          export PATH=/usr/local/pgsql/bin:$PATH
          initdb -D data
          pg_ctl -D data -l logfile start
          psql -d postgres -c "SELECT version();"
          psql -d postgres -c "SELECT current_setting('server_version_num');"
          popd

      - name: Script
        run: |
          export USE_PGXS=1
          export PATH=/usr/local/pgsql/bin:$PATH
          SHLIB_LINK=-lgcov PG_CPPFLAGS="-fprofile-arcs -ftest-coverage -O0" make
          # USE_PGXS=1 is not required in Travis, and it is required in Github Actions
          sudo USE_PGXS=1 PATH=/usr/local/pgsql/bin:$PATH make install
          make installcheck || (cat regression.diffs && false)
        env:
          USE_PGXS: 1

  job_REL_19_ubuntu-latest:
    name: PG REL_19_ ubuntu-latest
    # SEEN JUN 2026
    # Ubuntu 24.04 - ubuntu-latest or ubuntu-24.04
    # https://github.com/actions/runner-images
    # noble (24.04, LTS), plucky (25.04, amd64 only)
    # https://wiki.postgresql.org/wiki/Apt
    # https://apt.postgresql.org/pub/repos/apt/dists/
    # ##
    # https://ftp.postgresql.org/pub/repos/apt/dists/noble-pgdg/
    # Regular expression search - "Package: postgresql-18$"
    # https://ftp.postgresql.org/pub/repos/apt/dists/noble-pgdg/main/binary-amd64/Packages
    runs-on: ubuntu-latest
    steps:
      - name: Echo site details
        run: echo building master
 
      - name: Checkout code
        uses: actions/checkout@v6
 
      - name: checkout postgres
        run: |
          set -x -v -e
          sudo apt-get update -qq
          sudo apt-key adv --keyserver keyserver.ubuntu.com --recv-keys E298A3A825C0D65DFD57CBB651716619E084DAB9
          sudo add-apt-repository "deb https://cloud.r-project.org/bin/linux/ubuntu $(lsb_release -cs)-cran40/"
          sudo apt-get install -qq r-base-dev acl bison flex libssl-dev
          sudo R --version
          sudo /etc/init.d/postgresql stop
          sudo apt-get remove --purge postgresql\*
          sudo rm -rf /etc/postgresql /var/lib/postgresql
          export PGSRCVERSION=REL_19_
          export ALLGITTAGS=$(git ls-remote --tags https://github.com/postgres/postgres.git | cut -c 52-)
          quantity() { echo ${ALLGITTAGS} | tr " " "\n" | grep -c "${PGSRCVERSION}${MARK}[0-9]"; }
          quality()  { echo ${ALLGITTAGS} | tr " " "\n" | grep -e "${PGSRCVERSION}${MARK}[0-9]" | tail -n 1; }
          export MARK=""
          export RET=$(quantity)
          if [ "${RET}" -gt "0" ]
          then
            export SPECGITTAG=$(quality)
            echo -n "Release(s) are found.  Taking the last Release . . . SPECGITTAG: ${SPECGITTAG}"
          else
            export MARK="RC"
            export RET=$(quantity)
            echo "Release(s) are not found.  Trying Release Candidates."
            if [ "${RET}" -gt "0" ]
            then
              export SPECGITTAG=$(quality)
              echo -n "Release Candidate(s) are found.  Taking the last Release Candidate . . . SPECGITTAG: ${SPECGITTAG}"
            else
              export MARK="BETA"
              export RET=$(quantity)
              echo "Release Candidate(s) are not found. Trying Betas."
              if [ "${RET}" -gt "0" ]
              then
                export SPECGITTAG=$(quality)
                echo -n "Beta(s) are found. Taking the last Beta . . . SPECGITTAG: ${SPECGITTAG}"
              else
                echo "Beta(s) are not found."
              fi
            fi
          fi
          echo "SPECGITTAG: ${SPECGITTAG}"
          git clone --branch $SPECGITTAG --depth=1 https://github.com/postgres/postgres.git
          pushd postgres
          ./configure
          make
          sudo make install
          export PATH=/usr/local/pgsql/bin:$PATH
          initdb -D data
          pg_ctl -D data -l logfile start
          psql -d postgres -c "SELECT version();"
          psql -d postgres -c "SELECT current_setting('server_version_num');"
          popd

      - name: Script
        run: |
          set -x -v -e
          export USE_PGXS=1
          export PATH=/usr/local/pgsql/bin:$PATH
          SHLIB_LINK=-lgcov PG_CPPFLAGS="-fprofile-arcs -ftest-coverage -O0" make
          # USE_PGXS=1 is not required in Travis, and it is required in Github Actions
          sudo USE_PGXS=1 PATH=/usr/local/pgsql/bin:$PATH make install
          make installcheck || (cat regression.diffs && false)
        env:
          USE_PGXS: 1

  job_master_ubuntu-24_04-riscv:
    name: PG master ubuntu-24.04-riscv
    runs-on: ubuntu-24.04-riscv
    steps:
      - name: Echo site details
        run: echo building master
 
      - name: Checkout code
        uses: actions/checkout@v6
 
      - name: Checkout
        run: |
          set -x -v -e

          export DEBIAN_FRONTEND=noninteractive
          # To build PostgreSQL and its C client library (libpq) from source
          sudo apt-get install --qq build-essential libreadline-dev zlib1g-dev flex bison libssl-dev -y
          git clone --branch master --depth 1 https://github.com/postgres/postgres.git postgres-src
          pushd postgres-src
          git checkout master
          ./configure --help
          ./configure --without-icu --without-readline --without-zlib --disable-rpath --enable-depend
          make 
          sudo make install
          export PATH=/usr/local/pgsql/bin:$PATH
          # andre added
          export PATH=/usr/local/pgsql/lib:${PATH}
          export LD_LIBRARY_PATH=/usr/local/pgsql/lib:${LD_LIBRARY_PATH}
          #
          initdb -D data
          pg_ctl -D data -l logfile start
          psql -d postgres -c "SELECT version();"
          psql -d postgres -c "SELECT current_setting('server_version_num');"
          popd

          sudo apt-get install -qq --no-install-recommends build-essential ca-certificates curl gcc gfortran libblas-dev libbz2-dev libcairo2-dev libcurl4-openssl-dev libicu-dev libjpeg-dev liblapack-dev liblzma-dev libpcre2-dev libpng-dev libreadline-dev libssl-dev libtiff-dev libx11-dev libxml2-dev libxt-dev zlib1g-dev -y
          #
          # https://rstudio.github.io/r-manuals/r-admin/Obtaining-R.html
          sudo apt-get install -qq subversion -y
          # r-devel
          svn checkout https://svn.r-project.org/R/trunk/ r-src
          pushd r-src
          ./configure --help
          ./configure --enable-R-shlib --disable-java --disable-byte-compiled-packages --disable-rpath --without-ICU --without-recommended-packages
          make
          sudo make install
          popd
          export PATH=/usr/local/bin:$PATH
          R --version
          popd

      - name: Script
        run: |
          set -x -v -e
          export PATH=/usr/local/pgsql/bin:$PATH
          # andre added
          export PATH=/usr/local/pgsql/lib:${PATH}
          export LD_LIBRARY_PATH=/usr/local/pgsql/lib:${LD_LIBRARY_PATH}
          # andre added
          export PATH=/usr/local/bin:$PATH
          
          export USE_PGXS=1
          export PATH=/usr/local/pgsql/bin:$PATH
          SHLIB_LINK=-lgcov PG_CPPFLAGS="-fprofile-arcs -ftest-coverage -O0" make
          # USE_PGXS=1 is not required in Travis, and it is required in Github Actions
          sudo USE_PGXS=1 PATH=/usr/local/pgsql/bin:$PATH make install
          make installcheck || (cat regression.diffs && false)
        env:
          USE_PGXS: 1

      - name: After Success
        # success() returns true, when none of the previous steps have failed or been canceled.
        if: ${{ success() }}
        # Uploads code coverage to codecov.io
        run: bash <(curl -s https://codecov.io/bash)



