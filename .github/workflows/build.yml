  test-cpu_info_test_cortex_a76_adj:
    # Ubuntu 24.04 ships qemu >= 8.2 which synthesizes /proc/cpuinfo from the
    # -cpu option on aarch64. No cpu_info bind mount is used here.
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - uses: pguyot/arm-runner-action@HEAD
      with:
        bind_mount_repository: true
        cpu: cortex-a76
        base_image: raspios_lite_arm64:latest
        # cannot copy extracted data for './opt/R/4.6.1/lib/R/include/R_ext/Error.h' to '/opt/R/4.6.1/lib/R/include/R_ext/Error.h.dpkg-new'
        #   failed to write (No space left on device)
        # Enlarge the image by this number of MB. Default is to not enlarge the image.
        image_additional_mb: 1024
        commands: |
            set -x -v -e
            echo "Minimal"
            uname -m
            uname -a
            cat /proc/cpuinfo
            cat /proc/meminfo
            free -h
            # trixie - JUL 2026
            cat /etc/os-release
            # Install R from source
            # https://docs.posit.co/resources/install-r-source.html
            # Install R , Download and install R
            # https://docs.posit.co/resources/install-r.html
            export R_VERSION=4.6.1
            # Debian 13 trixie
            curl -O https://cdn.posit.co/r/debian-13/pkgs/r-${R_VERSION}_1_$(dpkg --print-architecture).deb
            sudo apt-get update
            sudo apt-get install -y ./r-${R_VERSION}_1_$(dpkg --print-architecture).deb
            /opt/R/${R_VERSION}/bin/R --version
            sudo ln -s /opt/R/${R_VERSION}/bin/R /usr/local/bin/R
            sudo ln -s /opt/R/${R_VERSION}/bin/Rscript /usr/local/bin/Rscript


